name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corkboard
          POSTGRES_PASSWORD: corkboard_ci_pw
          POSTGRES_DB: corkboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corkboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://corkboard:corkboard_ci_pw@localhost:5432/corkboard?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
